{% extends 'base.html' %}
{% block title %}Bienvenido{% endblock %}

{% block content %}
<div class="py-16 text-center">
  <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
    <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
  </div>
  <h1 class="text-3xl font-bold text-gray-900 mb-3">Sistema de Evaluación de Riesgos</h1>
  <p class="text-gray-500 text-lg mb-2">Plataforma basada en metodología <span class="font-semibold text-gray-700">MAGERIT v3</span></p>
  <p class="text-gray-400 text-sm mb-8">Alineado con ISO/IEC 27002:2022</p>
  <div class="flex items-center justify-center gap-3">
    <a href="{{ url_for('auth.login') }}"
       class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">
      <i data-lucide="log-in" class="w-4 h-4"></i>Iniciar Sesión
    </a>
    <a href="{{ url_for('auth.register') }}"
       class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg transition-colors">
      <i data-lucide="user-plus" class="w-4 h-4"></i>Registrarse
    </a>
  </div>
</div>
{% endblock %}
